document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"5260c171-fd0f-4729-9462-fa3b1cb0ff81\"><\u002Fscript>\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>/* Allianz Neo — self-hosted brand font */\n@font-face{font-family:\"Allianz Neo\";src:url(\"dba94e4a-267b-4444-a821-c806d6e35292\") format(\"opentype\");font-weight:400;font-style:normal;font-display:swap}\n<\u002Fstyle>\n<style>/* ==========================================================================\n   Allianz A1 Design System — Foundation Tokens\n   Colors, typography, spacing, radii, shadows, motion\n   ========================================================================== */\n\n:root {\n  /* ---------- Brand / Core ------------------------------------------------ */\n  --a1-blue-dark:        #003781;  /* Primary brand. Text on light, filled bgs */\n  --a1-blue-darker:      #00266D;  /* Hover on primary */\n  --a1-blue-darkest:     #001955;  /* Active / pressed */\n  --a1-blue-midnight:    #122B54;  /* Body text strong */\n  --a1-blue-bright:      #0E98CC;  /* Accent / info */\n  --a1-blue-steel:       #3F72B1;\n  --a1-blue-sky:         #6590BD;\n  --a1-blue-pale:        #C3D7E9;\n  --a1-blue-ice:         #DBEAF5;\n  --a1-blue-fog:         #F0F7FC;  /* Surface-2 */\n\n  /* ---------- Neutrals ---------------------------------------------------- */\n  --a1-ink-900:          #091223;  /* Highest contrast text */\n  --a1-ink-700:          #122B54;\n  --a1-ink-500:          #4B5975;\n  --a1-ink-400:          #6B7693;\n  --a1-ink-300:          #9EA4B4;\n  --a1-ink-200:          #C2C6D0;\n  --a1-ink-150:          #CED0D8;\n  --a1-ink-100:          #D3D6DD;\n  --a1-ink-75:           #E3E5EA;\n  --a1-ink-50:           #F5F5F7;  /* Surface-1 */\n  --a1-ink-0:            #FFFFFF;\n\n  /* ---------- Semantic --------------------------------------------------- */\n  --a1-red:              #DD0A42;  /* Error / destructive */\n  --a1-red-dark:         #AA001B;\n  --a1-red-darker:       #7C0007;\n  --a1-red-bg:           #FCE7ED;\n\n  --a1-amber:            #B48602;  /* Warning */\n  --a1-amber-dark:       #8F6A00;\n  --a1-amber-bg:         #FFF4D6;\n\n  --a1-green:            #05813C;  /* Success */\n  --a1-green-dark:       #02632D;\n  --a1-green-bg:         #E2F3E7;\n\n  --a1-violet:           #9747FF;  /* Promotional */\n  --a1-violet-dark:      #6F28D1;\n  --a1-violet-bg:        #DBD4FF;\n\n  --a1-plum:             #962165;  /* Tertiary accent */\n\n  /* ---------- Surfaces --------------------------------------------------- */\n  --surface-0:           #FFFFFF;\n  --surface-1:           var(--a1-ink-50);\n  --surface-2:           var(--a1-blue-fog);\n  --surface-inverse:     var(--a1-blue-darkest);\n\n  /* ---------- Focus ring -------------------------------------------------- */\n  --focus-ring:          0 0 0 2px #FFFFFF, 0 0 0 4px var(--a1-blue-bright);\n\n  /* ---------- Typography -------------------------------------------------- */\n  --font-sans: \"Allianz Neo\", \"Allianz\", \"Allianz Sans\", -apple-system,\n    BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif;\n  --font-num: var(--font-sans);\n\n  /* Type ramp — matches Figma metadata sizes */\n  --fs-display-xl: 45px;\n  --fs-display-lg: 44px;\n  --fs-display-md: 37px;\n  --fs-display-sm: 31px;\n  --fs-heading-xl: 29px;\n  --fs-heading-lg: 26px;\n  --fs-heading-md: 22px;\n  --fs-heading-sm: 20px;\n  --fs-body-lg:    18px;\n  --fs-body-md:    16px;\n  --fs-body-sm:    15px;\n  --fs-caption:    14px;\n  --fs-micro:      12px;\n\n  --lh-tight:      1.1;   /* @kind font */\n  --lh-snug:       1.25;  /* @kind font */\n  --lh-normal:     1.45;  /* @kind font */\n  --lh-relaxed:    1.6;   /* @kind font */\n\n  --fw-light:      300;   /* @kind font */\n  --fw-regular:    400;   /* @kind font */\n  --fw-semibold:   600;   /* @kind font */\n  --fw-bold:       700;   /* @kind font */\n\n  /* ---------- Spacing ---------------------------------------------------- */\n  --sp-0:  0;    /* @kind spacing */\n  --sp-1:  4px;\n  --sp-2:  8px;\n  --sp-3:  12px;\n  --sp-4:  16px;\n  --sp-5:  20px;\n  --sp-6:  24px;\n  --sp-7:  32px;\n  --sp-8:  40px;\n  --sp-9:  48px;\n  --sp-10: 64px;\n  --sp-11: 80px;\n  --sp-12: 96px;\n\n  /* ---------- Radius ----------------------------------------------------- */\n  --r-sm:   2px;\n  --r-md:   4px;\n  --r-lg:   8px;   /* default for cards, inputs */\n  --r-xl:   16px;\n  --r-pill: 999px;\n\n  /* ---------- Shadows / Elevations --------------------------------------- */\n  /* Derived from Figma shadow tokens (navy-tinted) */\n  --shadow-1: 0 1px 2px rgba(18,43,84,.08), 0 1px 1px rgba(18,43,84,.06);\n  --shadow-2: 0 2px 4px rgba(18,43,84,.12), 0 4px 8px rgba(18,43,84,.08);\n  --shadow-3: 0 4px 8px rgba(18,43,84,.12), 0 8px 20px rgba(18,43,84,.12);\n  --shadow-4: 0 12px 24px rgba(18,43,84,.16), 0 24px 48px rgba(18,43,84,.12);\n  --shadow-inset-border: inset 0 0 0 1px var(--a1-ink-100);\n\n  /* ---------- Motion ----------------------------------------------------- */\n  --ease-standard: cubic-bezier(.2,0,0,1);    /* @kind other */\n  --ease-emphasized: cubic-bezier(.2,0,.1,1); /* @kind other */\n  --dur-xs: 80ms;   /* @kind other */\n  --dur-sm: 160ms;  /* @kind other */\n  --dur-md: 240ms;  /* @kind other */\n  --dur-lg: 360ms;  /* @kind other */\n\n  /* ---------- Layout ------------------------------------------------------ */\n  --bp-s: 600px;   /* @kind other */\n  --bp-m: 900px;   /* @kind other */\n  --bp-l: 1200px;  /* @kind other */\n  --bp-xl: 1440px; /* @kind other */\n  --container-max: 1280px; /* @kind spacing */\n  --grid-gap: 24px;        /* @kind spacing */\n}\n<\u002Fstyle>\n<style>/* ==========================================================================\n   Allianz A1 — Base / reset / typography utilities\n   ========================================================================== */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml {\n  font-family: var(--font-sans);\n  color: var(--a1-ink-900);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n}\n\nbody {\n  margin: 0;\n  font-size: var(--fs-body-md);\n  line-height: var(--lh-normal);\n  background: var(--surface-0);\n  color: var(--a1-ink-900);\n}\n\nh1, h2, h3, h4, h5, h6, p { margin: 0; }\n\na { color: var(--a1-blue-dark); text-decoration: underline; text-underline-offset: 2px; }\na:hover { color: var(--a1-blue-darker); }\na:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: 2px; }\n\nbutton, input, select, textarea { font: inherit; color: inherit; }\nbutton { cursor: pointer; background: none; border: 0; padding: 0; }\n\nhr { border: 0; height: 1px; background: var(--a1-ink-75); margin: var(--sp-6) 0; }\n\n/* Type utility classes ------------------------------------------------------ */\n.ty-display-xl { font-size: var(--fs-display-xl); font-weight: var(--fw-semibold); line-height: var(--lh-tight); letter-spacing: -0.01em; color: var(--a1-blue-dark); }\n.ty-display-lg { font-size: var(--fs-display-lg); font-weight: var(--fw-semibold); line-height: var(--lh-tight); letter-spacing: -0.01em; color: var(--a1-blue-dark); }\n.ty-display-md { font-size: var(--fs-display-md); font-weight: var(--fw-semibold); line-height: var(--lh-tight); color: var(--a1-blue-dark); }\n.ty-display-sm { font-size: var(--fs-display-sm); font-weight: var(--fw-semibold); line-height: var(--lh-snug); color: var(--a1-blue-dark); }\n\n.ty-heading-xl { font-size: var(--fs-heading-xl); font-weight: var(--fw-semibold); line-height: var(--lh-snug); color: var(--a1-blue-dark); }\n.ty-heading-lg { font-size: var(--fs-heading-lg); font-weight: var(--fw-bold); line-height: var(--lh-snug); color: var(--a1-blue-dark); }\n.ty-heading-md { font-size: var(--fs-heading-md); font-weight: var(--fw-bold); line-height: var(--lh-snug); color: var(--a1-ink-900); }\n.ty-heading-sm { font-size: var(--fs-heading-sm); font-weight: var(--fw-bold); line-height: var(--lh-snug); color: var(--a1-ink-900); }\n\n.ty-body-lg { font-size: var(--fs-body-lg); line-height: var(--lh-relaxed); color: var(--a1-ink-900); }\n.ty-body-md { font-size: var(--fs-body-md); line-height: var(--lh-normal); color: var(--a1-ink-900); }\n.ty-body-sm { font-size: var(--fs-body-sm); line-height: var(--lh-normal); color: var(--a1-ink-500); }\n.ty-caption { font-size: var(--fs-caption); line-height: var(--lh-normal); color: var(--a1-ink-500); }\n.ty-micro   { font-size: var(--fs-micro); line-height: var(--lh-normal); color: var(--a1-ink-500); letter-spacing: 0.02em; }\n\n.ty-bold { font-weight: var(--fw-bold); }\n.ty-semibold { font-weight: var(--fw-semibold); }\n.ty-regular { font-weight: var(--fw-regular); }\n.ty-ink-strong { color: var(--a1-ink-900); }\n.ty-ink-muted  { color: var(--a1-ink-500); }\n.ty-on-dark    { color: var(--surface-0); }\n<\u002Fstyle>\n<style>/* ==========================================================================\n   Allianz A1 — Core components\n   ========================================================================== */\n\n/* Buttons ---------------------------------------------------------------- */\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: var(--sp-2);\n  min-height: 48px;\n  padding: 12px 24px;\n  font-size: var(--fs-body-md);\n  font-weight: var(--fw-bold);\n  line-height: 1;\n  border-radius: var(--r-pill);\n  border: 2px solid transparent;\n  color: var(--surface-0);\n  background: var(--a1-blue-dark);\n  transition: background var(--dur-sm) var(--ease-standard),\n              color var(--dur-sm) var(--ease-standard),\n              border-color var(--dur-sm) var(--ease-standard),\n              box-shadow var(--dur-sm) var(--ease-standard),\n              transform var(--dur-xs) var(--ease-standard);\n  white-space: nowrap;\n}\n.btn:hover { background: var(--a1-blue-darker); }\n.btn:active { background: var(--a1-blue-darkest); transform: translateY(1px); }\n.btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }\n.btn[disabled], .btn.is-disabled { background: var(--a1-ink-100); color: var(--a1-ink-400); cursor: not-allowed; }\n\n.btn--secondary {\n  background: transparent;\n  color: var(--a1-blue-dark);\n  border-color: var(--a1-blue-dark);\n}\n.btn--secondary:hover { background: var(--a1-blue-fog); }\n.btn--secondary:active { background: var(--a1-blue-ice); }\n\n.btn--tertiary {\n  background: transparent;\n  color: var(--a1-blue-dark);\n  border-color: transparent;\n  padding-left: var(--sp-4);\n  padding-right: var(--sp-4);\n}\n.btn--tertiary:hover { background: var(--a1-blue-fog); }\n\n.btn--destructive { background: var(--a1-red); }\n.btn--destructive:hover { background: var(--a1-red-dark); }\n.btn--destructive:active { background: var(--a1-red-darker); }\n\n.btn--sm { min-height: 40px; padding: 10px 20px; font-size: var(--fs-body-sm); }\n.btn--lg { min-height: 56px; padding: 16px 32px; font-size: var(--fs-body-lg); }\n\n.btn--icon-only { padding-left: 0; padding-right: 0; width: 48px; }\n.btn--sm.btn--icon-only { width: 40px; }\n.btn--lg.btn--icon-only { width: 56px; }\n.btn .icon { width: 20px; height: 20px; flex: none; }\n.btn--inverse { background: var(--surface-0); color: var(--a1-blue-dark); }\n.btn--inverse:hover { background: var(--a1-blue-ice); }\n\n/* Plain / link-style button */\n.btn-plain {\n  display: inline-flex;\n  align-items: center;\n  gap: var(--sp-2);\n  color: var(--a1-blue-dark);\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-body-md);\n  padding: 4px 0;\n  border-radius: 2px;\n}\n.btn-plain:hover { color: var(--a1-blue-darker); text-decoration: underline; text-underline-offset: 3px; }\n.btn-plain:focus-visible { outline: none; box-shadow: var(--focus-ring); }\n\n/* Inputs ---------------------------------------------------------------- */\n.field { display: block; }\n.field__label {\n  display: block;\n  font-size: var(--fs-caption);\n  font-weight: var(--fw-semibold);\n  color: var(--a1-ink-700);\n  margin-bottom: var(--sp-2);\n}\n.field__required { color: var(--a1-red); }\n\n.input {\n  width: 100%;\n  height: 48px;\n  padding: 0 var(--sp-4);\n  font-size: var(--fs-body-md);\n  color: var(--a1-ink-900);\n  background: var(--surface-0);\n  border: 1px solid var(--a1-ink-200);\n  border-radius: var(--r-md);\n  transition: border-color var(--dur-sm) var(--ease-standard), box-shadow var(--dur-sm) var(--ease-standard);\n  outline: none;\n}\n.input:hover { border-color: var(--a1-ink-400); }\n.input:focus { border-color: var(--a1-blue-dark); box-shadow: 0 0 0 3px rgba(14,152,204,.25); }\n.input::placeholder { color: var(--a1-ink-400); }\n\n.input--error { border-color: var(--a1-red); }\n.input--error:focus { box-shadow: 0 0 0 3px rgba(221,10,66,.18); }\n\n.field__hint  { font-size: var(--fs-caption); color: var(--a1-ink-500); margin-top: var(--sp-2); }\n.field__error { font-size: var(--fs-caption); color: var(--a1-red); margin-top: var(--sp-2); font-weight: var(--fw-semibold); }\n\ntextarea.input { height: auto; padding: var(--sp-3) var(--sp-4); line-height: var(--lh-normal); min-height: 96px; resize: vertical; }\n\n/* Checkbox / radio ------------------------------------------------------- */\n.check, .radio {\n  display: inline-flex;\n  align-items: flex-start;\n  gap: var(--sp-3);\n  cursor: pointer;\n  font-size: var(--fs-body-md);\n  color: var(--a1-ink-900);\n}\n.check input, .radio input { position: absolute; opacity: 0; pointer-events: none; }\n.check__box, .radio__box {\n  width: 20px; height: 20px;\n  flex: none;\n  border: 2px solid var(--a1-ink-400);\n  background: var(--surface-0);\n  display: inline-grid; place-items: center;\n  transition: border-color var(--dur-sm), background var(--dur-sm);\n  margin-top: 1px;\n}\n.check__box { border-radius: 3px; }\n.radio__box { border-radius: 50%; }\n.check input:checked + .check__box,\n.radio input:checked + .radio__box {\n  background: var(--a1-blue-dark); border-color: var(--a1-blue-dark);\n}\n.check__box svg { width: 14px; height: 14px; color: #fff; opacity: 0; }\n.check input:checked + .check__box svg { opacity: 1; }\n.radio__box::after {\n  content: ''; width: 8px; height: 8px; border-radius: 50%; background: #fff; opacity: 0;\n  transition: opacity var(--dur-sm);\n}\n.radio input:checked + .radio__box::after { opacity: 1; }\n.check input:focus-visible + .check__box,\n.radio input:focus-visible + .radio__box { box-shadow: var(--focus-ring); }\n\n/* Switch ----------------------------------------------------------------- */\n.switch { position: relative; display: inline-flex; align-items: center; gap: var(--sp-3); cursor: pointer; }\n.switch input { position: absolute; opacity: 0; pointer-events: none; }\n.switch__track {\n  width: 44px; height: 24px; border-radius: var(--r-pill);\n  background: var(--a1-ink-200);\n  transition: background var(--dur-sm);\n  position: relative; flex: none;\n}\n.switch__track::after {\n  content: ''; position: absolute;\n  top: 3px; left: 3px;\n  width: 18px; height: 18px; border-radius: 50%;\n  background: var(--surface-0);\n  box-shadow: var(--shadow-1);\n  transition: transform var(--dur-sm) var(--ease-emphasized);\n}\n.switch input:checked + .switch__track { background: var(--a1-blue-dark); }\n.switch input:checked + .switch__track::after { transform: translateX(20px); }\n.switch input:focus-visible + .switch__track { box-shadow: var(--focus-ring); }\n\n/* Tags / badges ---------------------------------------------------------- */\n.tag {\n  display: inline-flex; align-items: center; gap: var(--sp-1);\n  height: 24px; padding: 0 var(--sp-3);\n  font-size: var(--fs-caption); font-weight: var(--fw-semibold);\n  border-radius: var(--r-pill);\n  background: var(--a1-blue-fog); color: var(--a1-blue-dark);\n}\n.tag--neutral { background: var(--a1-ink-75); color: var(--a1-ink-700); }\n.tag--success { background: var(--a1-green-bg); color: var(--a1-green-dark); }\n.tag--warning { background: var(--a1-amber-bg); color: var(--a1-amber-dark); }\n.tag--danger  { background: var(--a1-red-bg); color: var(--a1-red-dark); }\n.tag--promo   { background: var(--a1-violet-bg); color: var(--a1-violet-dark); }\n\n.badge {\n  display: inline-flex; align-items: center; justify-content: center;\n  min-width: 20px; height: 20px; padding: 0 6px;\n  background: var(--a1-red); color: #fff;\n  font-size: var(--fs-micro); font-weight: var(--fw-bold);\n  border-radius: var(--r-pill); line-height: 1;\n}\n\n/* Card ------------------------------------------------------------------- */\n.card {\n  background: var(--surface-0);\n  border-radius: var(--r-lg);\n  box-shadow: var(--shadow-2);\n  padding: var(--sp-6);\n}\n.card--outlined { box-shadow: var(--shadow-inset-border); }\n.card--elevated { box-shadow: var(--shadow-3); }\n.card--tone-info   { background: var(--a1-blue-fog); box-shadow: none; }\n.card--tone-inverse{ background: var(--surface-inverse); color: #fff; box-shadow: none; }\n.card--tone-inverse .ty-body-sm { color: rgba(255,255,255,.7); }\n\n/* Alerts / messages ------------------------------------------------------ */\n.msg {\n  display: flex; gap: var(--sp-3);\n  padding: var(--sp-4) var(--sp-5);\n  border-radius: var(--r-md);\n  background: var(--a1-blue-fog); color: var(--a1-ink-900);\n  border-left: 4px solid var(--a1-blue-bright);\n}\n.msg__icon { flex: none; width: 24px; height: 24px; color: var(--a1-blue-bright); }\n.msg__title { font-weight: var(--fw-bold); color: var(--a1-ink-900); margin-bottom: var(--sp-1); }\n.msg__body  { font-size: var(--fs-body-sm); color: var(--a1-ink-700); }\n.msg--success { background: var(--a1-green-bg); border-color: var(--a1-green); }\n.msg--success .msg__icon { color: var(--a1-green); }\n.msg--warning { background: var(--a1-amber-bg); border-color: var(--a1-amber); }\n.msg--warning .msg__icon { color: var(--a1-amber); }\n.msg--danger  { background: var(--a1-red-bg);   border-color: var(--a1-red); }\n.msg--danger  .msg__icon { color: var(--a1-red); }\n\n/* Divider ---------------------------------------------------------------- */\n.divider { height: 1px; background: var(--a1-ink-75); border: 0; margin: var(--sp-5) 0; }\n.divider--strong { background: var(--a1-ink-150); }\n\n/* Avatar ----------------------------------------------------------------- */\n.avatar {\n  width: 40px; height: 40px; border-radius: 50%;\n  background: var(--a1-blue-ice); color: var(--a1-blue-dark);\n  display: inline-grid; place-items: center;\n  font-weight: var(--fw-bold); font-size: var(--fs-body-sm);\n  overflow: hidden;\n}\n.avatar--lg { width: 56px; height: 56px; font-size: var(--fs-body-lg); }\n.avatar--sm { width: 32px; height: 32px; font-size: var(--fs-caption); }\n\n/* Tabs ------------------------------------------------------------------- */\n.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--a1-ink-100); }\n.tab {\n  padding: var(--sp-3) var(--sp-5);\n  font-size: var(--fs-body-md);\n  font-weight: var(--fw-semibold);\n  color: var(--a1-ink-500);\n  border-bottom: 3px solid transparent;\n  margin-bottom: -1px;\n  transition: color var(--dur-sm), border-color var(--dur-sm);\n}\n.tab:hover { color: var(--a1-blue-dark); }\n.tab.is-active { color: var(--a1-blue-dark); border-bottom-color: var(--a1-blue-dark); }\n\n/* Links ------------------------------------------------------------------ */\n.link-arrow {\n  display: inline-flex; align-items: center; gap: var(--sp-2);\n  color: var(--a1-blue-dark); text-decoration: none; font-weight: var(--fw-semibold);\n}\n.link-arrow:hover { text-decoration: underline; text-underline-offset: 3px; }\n.link-arrow .icon { width: 16px; height: 16px; transition: transform var(--dur-sm); }\n.link-arrow:hover .icon { transform: translateX(2px); }\n\n/* Breadcrumb ------------------------------------------------------------- */\n.breadcrumb { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-body-sm); color: var(--a1-ink-500); }\n.breadcrumb a { color: var(--a1-ink-500); text-decoration: none; }\n.breadcrumb a:hover { color: var(--a1-blue-dark); text-decoration: underline; }\n.breadcrumb__sep { color: var(--a1-ink-300); }\n.breadcrumb__current { color: var(--a1-ink-900); font-weight: var(--fw-semibold); }\n<\u002Fstyle>\n<style>/* Allianz A1 Design System — root entry. Link this single file in consumers. */\n/* Allianz Neo — self-hosted brand font */\n@font-face{font-family:\"Allianz Neo\";src:url(\"dba94e4a-267b-4444-a821-c806d6e35292\") format(\"opentype\");font-weight:400;font-style:normal;font-display:swap}\n\n/* ==========================================================================\n   Allianz A1 Design System — Foundation Tokens\n   Colors, typography, spacing, radii, shadows, motion\n   ========================================================================== */\n\n:root {\n  /* ---------- Brand / Core ------------------------------------------------ */\n  --a1-blue-dark:        #003781;  /* Primary brand. Text on light, filled bgs */\n  --a1-blue-darker:      #00266D;  /* Hover on primary */\n  --a1-blue-darkest:     #001955;  /* Active / pressed */\n  --a1-blue-midnight:    #122B54;  /* Body text strong */\n  --a1-blue-bright:      #0E98CC;  /* Accent / info */\n  --a1-blue-steel:       #3F72B1;\n  --a1-blue-sky:         #6590BD;\n  --a1-blue-pale:        #C3D7E9;\n  --a1-blue-ice:         #DBEAF5;\n  --a1-blue-fog:         #F0F7FC;  /* Surface-2 */\n\n  /* ---------- Neutrals ---------------------------------------------------- */\n  --a1-ink-900:          #091223;  /* Highest contrast text */\n  --a1-ink-700:          #122B54;\n  --a1-ink-500:          #4B5975;\n  --a1-ink-400:          #6B7693;\n  --a1-ink-300:          #9EA4B4;\n  --a1-ink-200:          #C2C6D0;\n  --a1-ink-150:          #CED0D8;\n  --a1-ink-100:          #D3D6DD;\n  --a1-ink-75:           #E3E5EA;\n  --a1-ink-50:           #F5F5F7;  /* Surface-1 */\n  --a1-ink-0:            #FFFFFF;\n\n  /* ---------- Semantic --------------------------------------------------- */\n  --a1-red:              #DD0A42;  /* Error / destructive */\n  --a1-red-dark:         #AA001B;\n  --a1-red-darker:       #7C0007;\n  --a1-red-bg:           #FCE7ED;\n\n  --a1-amber:            #B48602;  /* Warning */\n  --a1-amber-dark:       #8F6A00;\n  --a1-amber-bg:         #FFF4D6;\n\n  --a1-green:            #05813C;  /* Success */\n  --a1-green-dark:       #02632D;\n  --a1-green-bg:         #E2F3E7;\n\n  --a1-violet:           #9747FF;  /* Promotional */\n  --a1-violet-dark:      #6F28D1;\n  --a1-violet-bg:        #DBD4FF;\n\n  --a1-plum:             #962165;  /* Tertiary accent */\n\n  /* ---------- Surfaces --------------------------------------------------- */\n  --surface-0:           #FFFFFF;\n  --surface-1:           var(--a1-ink-50);\n  --surface-2:           var(--a1-blue-fog);\n  --surface-inverse:     var(--a1-blue-darkest);\n\n  /* ---------- Focus ring -------------------------------------------------- */\n  --focus-ring:          0 0 0 2px #FFFFFF, 0 0 0 4px var(--a1-blue-bright);\n\n  /* ---------- Typography -------------------------------------------------- */\n  --font-sans: \"Allianz Neo\", \"Allianz\", \"Allianz Sans\", -apple-system,\n    BlinkMacSystemFont, \"Segoe UI\", Helvetica, Arial, sans-serif;\n  --font-num: var(--font-sans);\n\n  /* Type ramp — matches Figma metadata sizes */\n  --fs-display-xl: 45px;\n  --fs-display-lg: 44px;\n  --fs-display-md: 37px;\n  --fs-display-sm: 31px;\n  --fs-heading-xl: 29px;\n  --fs-heading-lg: 26px;\n  --fs-heading-md: 22px;\n  --fs-heading-sm: 20px;\n  --fs-body-lg:    18px;\n  --fs-body-md:    16px;\n  --fs-body-sm:    15px;\n  --fs-caption:    14px;\n  --fs-micro:      12px;\n\n  --lh-tight:      1.1;   /* @kind font */\n  --lh-snug:       1.25;  /* @kind font */\n  --lh-normal:     1.45;  /* @kind font */\n  --lh-relaxed:    1.6;   /* @kind font */\n\n  --fw-light:      300;   /* @kind font */\n  --fw-regular:    400;   /* @kind font */\n  --fw-semibold:   600;   /* @kind font */\n  --fw-bold:       700;   /* @kind font */\n\n  /* ---------- Spacing ---------------------------------------------------- */\n  --sp-0:  0;    /* @kind spacing */\n  --sp-1:  4px;\n  --sp-2:  8px;\n  --sp-3:  12px;\n  --sp-4:  16px;\n  --sp-5:  20px;\n  --sp-6:  24px;\n  --sp-7:  32px;\n  --sp-8:  40px;\n  --sp-9:  48px;\n  --sp-10: 64px;\n  --sp-11: 80px;\n  --sp-12: 96px;\n\n  /* ---------- Radius ----------------------------------------------------- */\n  --r-sm:   2px;\n  --r-md:   4px;\n  --r-lg:   8px;   /* default for cards, inputs */\n  --r-xl:   16px;\n  --r-pill: 999px;\n\n  /* ---------- Shadows / Elevations --------------------------------------- */\n  /* Derived from Figma shadow tokens (navy-tinted) */\n  --shadow-1: 0 1px 2px rgba(18,43,84,.08), 0 1px 1px rgba(18,43,84,.06);\n  --shadow-2: 0 2px 4px rgba(18,43,84,.12), 0 4px 8px rgba(18,43,84,.08);\n  --shadow-3: 0 4px 8px rgba(18,43,84,.12), 0 8px 20px rgba(18,43,84,.12);\n  --shadow-4: 0 12px 24px rgba(18,43,84,.16), 0 24px 48px rgba(18,43,84,.12);\n  --shadow-inset-border: inset 0 0 0 1px var(--a1-ink-100);\n\n  /* ---------- Motion ----------------------------------------------------- */\n  --ease-standard: cubic-bezier(.2,0,0,1);    /* @kind other */\n  --ease-emphasized: cubic-bezier(.2,0,.1,1); /* @kind other */\n  --dur-xs: 80ms;   /* @kind other */\n  --dur-sm: 160ms;  /* @kind other */\n  --dur-md: 240ms;  /* @kind other */\n  --dur-lg: 360ms;  /* @kind other */\n\n  /* ---------- Layout ------------------------------------------------------ */\n  --bp-s: 600px;   /* @kind other */\n  --bp-m: 900px;   /* @kind other */\n  --bp-l: 1200px;  /* @kind other */\n  --bp-xl: 1440px; /* @kind other */\n  --container-max: 1280px; /* @kind spacing */\n  --grid-gap: 24px;        /* @kind spacing */\n}\n\n/* ==========================================================================\n   Allianz A1 — Base / reset / typography utilities\n   ========================================================================== */\n\n*, *::before, *::after { box-sizing: border-box; }\n\nhtml {\n  font-family: var(--font-sans);\n  color: var(--a1-ink-900);\n  -webkit-font-smoothing: antialiased;\n  -moz-osx-font-smoothing: grayscale;\n  text-rendering: optimizeLegibility;\n}\n\nbody {\n  margin: 0;\n  font-size: var(--fs-body-md);\n  line-height: var(--lh-normal);\n  background: var(--surface-0);\n  color: var(--a1-ink-900);\n}\n\nh1, h2, h3, h4, h5, h6, p { margin: 0; }\n\na { color: var(--a1-blue-dark); text-decoration: underline; text-underline-offset: 2px; }\na:hover { color: var(--a1-blue-darker); }\na:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: 2px; }\n\nbutton, input, select, textarea { font: inherit; color: inherit; }\nbutton { cursor: pointer; background: none; border: 0; padding: 0; }\n\nhr { border: 0; height: 1px; background: var(--a1-ink-75); margin: var(--sp-6) 0; }\n\n/* Type utility classes ------------------------------------------------------ */\n.ty-display-xl { font-size: var(--fs-display-xl); font-weight: var(--fw-semibold); line-height: var(--lh-tight); letter-spacing: -0.01em; color: var(--a1-blue-dark); }\n.ty-display-lg { font-size: var(--fs-display-lg); font-weight: var(--fw-semibold); line-height: var(--lh-tight); letter-spacing: -0.01em; color: var(--a1-blue-dark); }\n.ty-display-md { font-size: var(--fs-display-md); font-weight: var(--fw-semibold); line-height: var(--lh-tight); color: var(--a1-blue-dark); }\n.ty-display-sm { font-size: var(--fs-display-sm); font-weight: var(--fw-semibold); line-height: var(--lh-snug); color: var(--a1-blue-dark); }\n\n.ty-heading-xl { font-size: var(--fs-heading-xl); font-weight: var(--fw-semibold); line-height: var(--lh-snug); color: var(--a1-blue-dark); }\n.ty-heading-lg { font-size: var(--fs-heading-lg); font-weight: var(--fw-bold); line-height: var(--lh-snug); color: var(--a1-blue-dark); }\n.ty-heading-md { font-size: var(--fs-heading-md); font-weight: var(--fw-bold); line-height: var(--lh-snug); color: var(--a1-ink-900); }\n.ty-heading-sm { font-size: var(--fs-heading-sm); font-weight: var(--fw-bold); line-height: var(--lh-snug); color: var(--a1-ink-900); }\n\n.ty-body-lg { font-size: var(--fs-body-lg); line-height: var(--lh-relaxed); color: var(--a1-ink-900); }\n.ty-body-md { font-size: var(--fs-body-md); line-height: var(--lh-normal); color: var(--a1-ink-900); }\n.ty-body-sm { font-size: var(--fs-body-sm); line-height: var(--lh-normal); color: var(--a1-ink-500); }\n.ty-caption { font-size: var(--fs-caption); line-height: var(--lh-normal); color: var(--a1-ink-500); }\n.ty-micro   { font-size: var(--fs-micro); line-height: var(--lh-normal); color: var(--a1-ink-500); letter-spacing: 0.02em; }\n\n.ty-bold { font-weight: var(--fw-bold); }\n.ty-semibold { font-weight: var(--fw-semibold); }\n.ty-regular { font-weight: var(--fw-regular); }\n.ty-ink-strong { color: var(--a1-ink-900); }\n.ty-ink-muted  { color: var(--a1-ink-500); }\n.ty-on-dark    { color: var(--surface-0); }\n\n/* ==========================================================================\n   Allianz A1 — Core components\n   ========================================================================== */\n\n/* Buttons ---------------------------------------------------------------- */\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: var(--sp-2);\n  min-height: 48px;\n  padding: 12px 24px;\n  font-size: var(--fs-body-md);\n  font-weight: var(--fw-bold);\n  line-height: 1;\n  border-radius: var(--r-pill);\n  border: 2px solid transparent;\n  color: var(--surface-0);\n  background: var(--a1-blue-dark);\n  transition: background var(--dur-sm) var(--ease-standard),\n              color var(--dur-sm) var(--ease-standard),\n              border-color var(--dur-sm) var(--ease-standard),\n              box-shadow var(--dur-sm) var(--ease-standard),\n              transform var(--dur-xs) var(--ease-standard);\n  white-space: nowrap;\n}\n.btn:hover { background: var(--a1-blue-darker); }\n.btn:active { background: var(--a1-blue-darkest); transform: translateY(1px); }\n.btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }\n.btn[disabled], .btn.is-disabled { background: var(--a1-ink-100); color: var(--a1-ink-400); cursor: not-allowed; }\n\n.btn--secondary {\n  background: transparent;\n  color: var(--a1-blue-dark);\n  border-color: var(--a1-blue-dark);\n}\n.btn--secondary:hover { background: var(--a1-blue-fog); }\n.btn--secondary:active { background: var(--a1-blue-ice); }\n\n.btn--tertiary {\n  background: transparent;\n  color: var(--a1-blue-dark);\n  border-color: transparent;\n  padding-left: var(--sp-4);\n  padding-right: var(--sp-4);\n}\n.btn--tertiary:hover { background: var(--a1-blue-fog); }\n\n.btn--destructive { background: var(--a1-red); }\n.btn--destructive:hover { background: var(--a1-red-dark); }\n.btn--destructive:active { background: var(--a1-red-darker); }\n\n.btn--sm { min-height: 40px; padding: 10px 20px; font-size: var(--fs-body-sm); }\n.btn--lg { min-height: 56px; padding: 16px 32px; font-size: var(--fs-body-lg); }\n\n.btn--icon-only { padding-left: 0; padding-right: 0; width: 48px; }\n.btn--sm.btn--icon-only { width: 40px; }\n.btn--lg.btn--icon-only { width: 56px; }\n.btn .icon { width: 20px; height: 20px; flex: none; }\n.btn--inverse { background: var(--surface-0); color: var(--a1-blue-dark); }\n.btn--inverse:hover { background: var(--a1-blue-ice); }\n\n/* Plain / link-style button */\n.btn-plain {\n  display: inline-flex;\n  align-items: center;\n  gap: var(--sp-2);\n  color: var(--a1-blue-dark);\n  font-weight: var(--fw-bold);\n  font-size: var(--fs-body-md);\n  padding: 4px 0;\n  border-radius: 2px;\n}\n.btn-plain:hover { color: var(--a1-blue-darker); text-decoration: underline; text-underline-offset: 3px; }\n.btn-plain:focus-visible { outline: none; box-shadow: var(--focus-ring); }\n\n/* Inputs ---------------------------------------------------------------- */\n.field { display: block; }\n.field__label {\n  display: block;\n  font-size: var(--fs-caption);\n  font-weight: var(--fw-semibold);\n  color: var(--a1-ink-700);\n  margin-bottom: var(--sp-2);\n}\n.field__required { color: var(--a1-red); }\n\n.input {\n  width: 100%;\n  height: 48px;\n  padding: 0 var(--sp-4);\n  font-size: var(--fs-body-md);\n  color: var(--a1-ink-900);\n  background: var(--surface-0);\n  border: 1px solid var(--a1-ink-200);\n  border-radius: var(--r-md);\n  transition: border-color var(--dur-sm) var(--ease-standard), box-shadow var(--dur-sm) var(--ease-standard);\n  outline: none;\n}\n.input:hover { border-color: var(--a1-ink-400); }\n.input:focus { border-color: var(--a1-blue-dark); box-shadow: 0 0 0 3px rgba(14,152,204,.25); }\n.input::placeholder { color: var(--a1-ink-400); }\n\n.input--error { border-color: var(--a1-red); }\n.input--error:focus { box-shadow: 0 0 0 3px rgba(221,10,66,.18); }\n\n.field__hint  { font-size: var(--fs-caption); color: var(--a1-ink-500); margin-top: var(--sp-2); }\n.field__error { font-size: var(--fs-caption); color: var(--a1-red); margin-top: var(--sp-2); font-weight: var(--fw-semibold); }\n\ntextarea.input { height: auto; padding: var(--sp-3) var(--sp-4); line-height: var(--lh-normal); min-height: 96px; resize: vertical; }\n\n/* Checkbox / radio ------------------------------------------------------- */\n.check, .radio {\n  display: inline-flex;\n  align-items: flex-start;\n  gap: var(--sp-3);\n  cursor: pointer;\n  font-size: var(--fs-body-md);\n  color: var(--a1-ink-900);\n}\n.check input, .radio input { position: absolute; opacity: 0; pointer-events: none; }\n.check__box, .radio__box {\n  width: 20px; height: 20px;\n  flex: none;\n  border: 2px solid var(--a1-ink-400);\n  background: var(--surface-0);\n  display: inline-grid; place-items: center;\n  transition: border-color var(--dur-sm), background var(--dur-sm);\n  margin-top: 1px;\n}\n.check__box { border-radius: 3px; }\n.radio__box { border-radius: 50%; }\n.check input:checked + .check__box,\n.radio input:checked + .radio__box {\n  background: var(--a1-blue-dark); border-color: var(--a1-blue-dark);\n}\n.check__box svg { width: 14px; height: 14px; color: #fff; opacity: 0; }\n.check input:checked + .check__box svg { opacity: 1; }\n.radio__box::after {\n  content: ''; width: 8px; height: 8px; border-radius: 50%; background: #fff; opacity: 0;\n  transition: opacity var(--dur-sm);\n}\n.radio input:checked + .radio__box::after { opacity: 1; }\n.check input:focus-visible + .check__box,\n.radio input:focus-visible + .radio__box { box-shadow: var(--focus-ring); }\n\n/* Switch ----------------------------------------------------------------- */\n.switch { position: relative; display: inline-flex; align-items: center; gap: var(--sp-3); cursor: pointer; }\n.switch input { position: absolute; opacity: 0; pointer-events: none; }\n.switch__track {\n  width: 44px; height: 24px; border-radius: var(--r-pill);\n  background: var(--a1-ink-200);\n  transition: background var(--dur-sm);\n  position: relative; flex: none;\n}\n.switch__track::after {\n  content: ''; position: absolute;\n  top: 3px; left: 3px;\n  width: 18px; height: 18px; border-radius: 50%;\n  background: var(--surface-0);\n  box-shadow: var(--shadow-1);\n  transition: transform var(--dur-sm) var(--ease-emphasized);\n}\n.switch input:checked + .switch__track { background: var(--a1-blue-dark); }\n.switch input:checked + .switch__track::after { transform: translateX(20px); }\n.switch input:focus-visible + .switch__track { box-shadow: var(--focus-ring); }\n\n/* Tags / badges ---------------------------------------------------------- */\n.tag {\n  display: inline-flex; align-items: center; gap: var(--sp-1);\n  height: 24px; padding: 0 var(--sp-3);\n  font-size: var(--fs-caption); font-weight: var(--fw-semibold);\n  border-radius: var(--r-pill);\n  background: var(--a1-blue-fog); color: var(--a1-blue-dark);\n}\n.tag--neutral { background: var(--a1-ink-75); color: var(--a1-ink-700); }\n.tag--success { background: var(--a1-green-bg); color: var(--a1-green-dark); }\n.tag--warning { background: var(--a1-amber-bg); color: var(--a1-amber-dark); }\n.tag--danger  { background: var(--a1-red-bg); color: var(--a1-red-dark); }\n.tag--promo   { background: var(--a1-violet-bg); color: var(--a1-violet-dark); }\n\n.badge {\n  display: inline-flex; align-items: center; justify-content: center;\n  min-width: 20px; height: 20px; padding: 0 6px;\n  background: var(--a1-red); color: #fff;\n  font-size: var(--fs-micro); font-weight: var(--fw-bold);\n  border-radius: var(--r-pill); line-height: 1;\n}\n\n/* Card ------------------------------------------------------------------- */\n.card {\n  background: var(--surface-0);\n  border-radius: var(--r-lg);\n  box-shadow: var(--shadow-2);\n  padding: var(--sp-6);\n}\n.card--outlined { box-shadow: var(--shadow-inset-border); }\n.card--elevated { box-shadow: var(--shadow-3); }\n.card--tone-info   { background: var(--a1-blue-fog); box-shadow: none; }\n.card--tone-inverse{ background: var(--surface-inverse); color: #fff; box-shadow: none; }\n.card--tone-inverse .ty-body-sm { color: rgba(255,255,255,.7); }\n\n/* Alerts / messages ------------------------------------------------------ */\n.msg {\n  display: flex; gap: var(--sp-3);\n  padding: var(--sp-4) var(--sp-5);\n  border-radius: var(--r-md);\n  background: var(--a1-blue-fog); color: var(--a1-ink-900);\n  border-left: 4px solid var(--a1-blue-bright);\n}\n.msg__icon { flex: none; width: 24px; height: 24px; color: var(--a1-blue-bright); }\n.msg__title { font-weight: var(--fw-bold); color: var(--a1-ink-900); margin-bottom: var(--sp-1); }\n.msg__body  { font-size: var(--fs-body-sm); color: var(--a1-ink-700); }\n.msg--success { background: var(--a1-green-bg); border-color: var(--a1-green); }\n.msg--success .msg__icon { color: var(--a1-green); }\n.msg--warning { background: var(--a1-amber-bg); border-color: var(--a1-amber); }\n.msg--warning .msg__icon { color: var(--a1-amber); }\n.msg--danger  { background: var(--a1-red-bg);   border-color: var(--a1-red); }\n.msg--danger  .msg__icon { color: var(--a1-red); }\n\n/* Divider ---------------------------------------------------------------- */\n.divider { height: 1px; background: var(--a1-ink-75); border: 0; margin: var(--sp-5) 0; }\n.divider--strong { background: var(--a1-ink-150); }\n\n/* Avatar ----------------------------------------------------------------- */\n.avatar {\n  width: 40px; height: 40px; border-radius: 50%;\n  background: var(--a1-blue-ice); color: var(--a1-blue-dark);\n  display: inline-grid; place-items: center;\n  font-weight: var(--fw-bold); font-size: var(--fs-body-sm);\n  overflow: hidden;\n}\n.avatar--lg { width: 56px; height: 56px; font-size: var(--fs-body-lg); }\n.avatar--sm { width: 32px; height: 32px; font-size: var(--fs-caption); }\n\n/* Tabs ------------------------------------------------------------------- */\n.tabs { display: flex; gap: 0; border-bottom: 1px solid var(--a1-ink-100); }\n.tab {\n  padding: var(--sp-3) var(--sp-5);\n  font-size: var(--fs-body-md);\n  font-weight: var(--fw-semibold);\n  color: var(--a1-ink-500);\n  border-bottom: 3px solid transparent;\n  margin-bottom: -1px;\n  transition: color var(--dur-sm), border-color var(--dur-sm);\n}\n.tab:hover { color: var(--a1-blue-dark); }\n.tab.is-active { color: var(--a1-blue-dark); border-bottom-color: var(--a1-blue-dark); }\n\n/* Links ------------------------------------------------------------------ */\n.link-arrow {\n  display: inline-flex; align-items: center; gap: var(--sp-2);\n  color: var(--a1-blue-dark); text-decoration: none; font-weight: var(--fw-semibold);\n}\n.link-arrow:hover { text-decoration: underline; text-underline-offset: 3px; }\n.link-arrow .icon { width: 16px; height: 16px; transition: transform var(--dur-sm); }\n.link-arrow:hover .icon { transform: translateX(2px); }\n\n/* Breadcrumb ------------------------------------------------------------- */\n.breadcrumb { display: flex; align-items: center; gap: var(--sp-2); font-size: var(--fs-body-sm); color: var(--a1-ink-500); }\n.breadcrumb a { color: var(--a1-ink-500); text-decoration: none; }\n.breadcrumb a:hover { color: var(--a1-blue-dark); text-decoration: underline; }\n.breadcrumb__sep { color: var(--a1-ink-300); }\n.breadcrumb__current { color: var(--a1-ink-900); font-weight: var(--fw-semibold); }\n\n<\u002Fstyle>\n<script src=\"ba102cb8-22fe-4e29-83da-99acadfd1ddd\"><\u002Fscript>\n<script src=\"b4872a94-0e04-4598-90a2-d46b697d762c\" integrity=\"sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i\" crossorigin=\"anonymous\"><\u002Fscript>\n<script src=\"b9b6834d-9144-4d9f-81cd-1ca0cef1c597\" integrity=\"sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67\" crossorigin=\"anonymous\"><\u002Fscript>\n<script src=\"eb7015e7-fda1-4a5f-83ff-b7f8b4280c24\"><\u002Fscript>\n<style>\nbody{margin:0;background:#F0F7FC;font-family:var(--font-sans);color:var(--a1-ink-900)}\na{color:var(--a1-blue-dark);text-decoration:none}\na:hover{color:var(--a1-blue-bright);text-decoration:underline}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<section id=\"dates\" style=\"padding:88px 40px;background:#F0F7FC\">\n  <div style=\"max-width:1200px;margin:0 auto;display:flex;flex-direction:column;gap:36px\">\n    <div style=\"background:var(--a1-blue-dark);border-radius:var(--r-xl);padding:44px 48px;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:32px;color:#fff\">\n      <div style=\"display:flex;flex-direction:column;gap:14px;min-width:0\">\n        <h2 style=\"margin:0;font-size:64px;line-height:.98;font-weight:var(--fw-semibold);letter-spacing:-.025em;color:#fff\">Find your date<\u002Fh2>\n        <p style=\"margin:0;font-size:var(--fs-body-md);color:rgba(255,255,255,.72)\">Click your location for details.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:flex;align-items:flex-end;gap:36px;flex:none\">\n        <div style=\"display:flex;flex-direction:column;gap:2px\">\n          <span style=\"font-size:56px;line-height:1;font-weight:var(--fw-semibold);letter-spacing:-.03em;color:#fff\">20<\u002Fspan>\n          <span style=\"font-size:var(--fs-caption);letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6)\">offices<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"width:1px;align-self:stretch;background:rgba(255,255,255,.2)\"><\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:2px\">\n          <span style=\"font-size:56px;line-height:1;font-weight:var(--fw-semibold);letter-spacing:.1em;color:#fff\">6-27<\u002Fspan>\n          <span style=\"font-size:var(--fs-caption);letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.6)\">October<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div id=\"snack-maps\" style=\"position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px\">\n      <sc-for list=\"{{ regions }}\" as=\"r\" hint-placeholder-count=\"3\">\n        <div style=\"background:#fff;border:1px solid var(--a1-ink-75);border-radius:var(--r-xl);box-shadow:var(--shadow-1);overflow:hidden;display:flex;flex-direction:column\">\n          <div style=\"display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:16px 20px 10px\">\n            <span style=\"font-size:var(--fs-body-md);font-weight:var(--fw-semibold);color:var(--a1-blue-dark)\">{{ r.name }}<\u002Fspan>\n            <span style=\"font-size:var(--fs-caption);color:var(--a1-ink-400)\">{{ r.count }}<\u002Fspan>\n          <\u002Fdiv>\n          <x-import component-from-global-scope=\"region-map\" from=\"21f2624b-efc2-4e6d-8341-b03104899fb1#/region-map-v2.js\" lon0=\"{{ r.lon0 }}\" lon1=\"{{ r.lon1 }}\" lat0=\"{{ r.lat0 }}\" lat1=\"{{ r.lat1 }}\" hint-size=\"100%,240px\"><\u002Fx-import>\n        <\u002Fdiv>\n      <\u002Fsc-for>\n\n      <sc-if value=\"{{ cardOpen }}\" hint-placeholder-val=\"{{ true }}\">\n        <div id=\"snack-card\" style=\"position:fixed;width:320px;max-width:calc(100vw - 24px);z-index:30;background:#fff;border:1px solid var(--a1-ink-75);border-radius:var(--r-lg);box-shadow:var(--shadow-4);overflow:hidden;left:{{ cardLeft }};top:{{ cardTop }}\">\n          <div style=\"padding:18px 20px;background:var(--a1-blue-dark);color:#fff;display:flex;align-items:flex-start;justify-content:space-between;gap:12px\">\n            <div style=\"display:flex;flex-direction:column;gap:3px\">\n              <span style=\"font-size:var(--fs-heading-md);font-weight:var(--fw-semibold);line-height:1.1\">{{ sel.city }}<\u002Fspan>\n              <span style=\"font-size:var(--fs-caption);opacity:.75\">{{ sel.country }}<\u002Fspan>\n            <\u002Fdiv>\n            <button type=\"button\" sc-camel-on-click=\"{{ closeCard }}\" aria-label=\"Close\" style=\"all:unset;cursor:pointer;width:26px;height:26px;border-radius:var(--r-pill);display:flex;align-items:center;justify-content:center;font-size:16px;line-height:1;color:rgba(255,255,255,.8);flex:none\" style-hover=\"background:rgba(255,255,255,.15);color:#fff\">×<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"padding:6px 20px 2px\">\n            <sc-for list=\"{{ selRows }}\" as=\"r\" hint-placeholder-count=\"2\">\n              <div style=\"display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-bottom:1px solid var(--a1-ink-75)\">\n                <span style=\"font-size:var(--fs-caption);color:var(--a1-ink-400);white-space:nowrap\">{{ r.k }}<\u002Fspan>\n                <span style=\"font-size:var(--fs-body-sm);font-weight:var(--fw-semibold);text-align:right;color:var(--a1-ink-900)\">{{ r.v }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <div style=\"padding:14px 20px 18px;display:flex;align-items:center;gap:12px\">\n            <div style=\"width:36px;height:36px;border-radius:var(--r-pill);background:var(--a1-blue-ice);display:flex;align-items:center;justify-content:center;font-size:var(--fs-caption);font-weight:var(--fw-semibold);color:var(--a1-blue-dark);flex:none\">{{ sel.initials }}<\u002Fdiv>\n            <div style=\"display:flex;flex-direction:column;min-width:0\">\n              <span style=\"font-size:var(--fs-body-sm);font-weight:var(--fw-semibold)\">{{ sel.host }}<\u002Fspan>\n              <a href=\"{{ sel.mailto }}\" style=\"font-size:var(--fs-caption);word-break:break-all\">{{ sel.email }}<\u002Fa>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n\n    <div style=\"display:flex;flex-direction:column;gap:14px\">\n      <h3 style=\"margin:0;font-size:var(--fs-heading-sm);font-weight:var(--fw-semibold);color:var(--a1-blue-dark)\">All dates<\u002Fh3>\n      <div style=\"display:grid;grid-template-columns:{{ listCols }};gap:12px\">\n        <sc-for list=\"{{ cities }}\" as=\"c\" hint-placeholder-count=\"20\">\n          <button type=\"button\" sc-camel-on-click=\"{{ c.pick }}\" data-city=\"{{ c.id }}\" style=\"all:unset;box-sizing:border-box;cursor:pointer;background:#fff;border:1px solid var(--a1-ink-75);border-left:3px solid var(--a1-blue-pale);border-radius:var(--r-lg);padding:14px 16px;display:flex;flex-direction:column;gap:4px;transition:box-shadow var(--dur-sm) var(--ease-standard),border-color var(--dur-sm) var(--ease-standard)\" style-hover=\"border-left-color:var(--a1-blue-bright);box-shadow:var(--shadow-2)\">\n            <span style=\"font-size:var(--fs-body-md);font-weight:var(--fw-semibold);color:var(--a1-blue-dark)\">{{ c.city }}<\u002Fspan>\n            <span style=\"font-size:var(--fs-caption);color:var(--a1-ink-500)\">{{ c.date }}<\u002Fspan>\n            <span style=\"font-size:var(--fs-caption);color:var(--a1-ink-400)\">{{ c.time }}<\u002Fspan>\n          <\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;dateListLayout&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;grid&quot;,&quot;list&quot;],&quot;default&quot;:&quot;grid&quot;,&quot;tsType&quot;:&quot;'grid' | 'list'&quot;,&quot;section&quot;:&quot;Dates&quot;}}\">\nclass Component extends DCLogic {\n  state = { sel: null, cities: [], cardOpen: false };\n\n  componentDidMount() {\n    this._onPick = (e) => {\n      const a = this._anchor || { x: e.detail.clientX, y: e.detail.clientY };\n      this._anchor = null;\n      this._last = a;\n      this.setState({ sel: e.detail, cardOpen: true, pos: this._pos(a) });\n    };\n    document.addEventListener(\"city-pick\", this._onPick);\n    this._onResize = () => { if (this.state.sel) this.setState({ pos: this._pos(this._last) }); };\n    window.addEventListener(\"resize\", this._onResize);\n    window.addEventListener(\"scroll\", this._onScroll = () => {\n      if (this.state.cardOpen) this.setState({ pos: this._pos(this._last) });\n    }, { passive: true });\n    const tick = () => {\n      if (window.SNACK_CITIES) this.setState({ cities: window.SNACK_CITIES, sel: this.state.sel || window.SNACK_CITIES[0] });\n      else setTimeout(tick, 60);\n    };\n    tick();\n  }\n  componentDidUpdate() {\n    const el = document.getElementById(\"snack-card\");\n    if (!el) return;\n    const h = el.offsetHeight;\n    if (h && h !== this._cardH) {\n      this._cardH = h;\n      if (this.state.sel) this.setState({ pos: this._pos(this._last) });\n    }\n  }\n  componentWillUnmount() {\n    document.removeEventListener(\"city-pick\", this._onPick);\n    window.removeEventListener(\"resize\", this._onResize);\n    window.removeEventListener(\"scroll\", this._onScroll);\n  }\n\n  _pos(a) {\n    if (!a || a.x == null) return null;\n    const CW = 320, CH = this._cardH || 280, PAD = 12, GAP = 18;\n    const vw = window.innerWidth, vh = window.innerHeight;\n    let x = a.x + GAP + CW <= vw - PAD ? a.x + GAP : a.x - CW - GAP;\n    x = Math.max(PAD, Math.min(x, Math.max(PAD, vw - CW - PAD)));\n    const y = Math.max(PAD, Math.min(a.y - 60, Math.max(PAD, vh - CH - PAD)));\n    return { left: x + \"px\", top: y + \"px\" };\n  }\n\n  pick(id, ev) {\n    const a = ev && ev.clientX != null\n      ? { x: ev.clientX, y: ev.clientY }\n      : (() => {\n          const b = document.querySelector('[data-city=\"' + id + '\"]');\n          if (!b) return null;\n          const r = b.getBoundingClientRect();\n          return { x: r.right - 8, y: r.top + r.height / 2 };\n        })();\n    this._anchor = a;\n    const maps = [...document.querySelectorAll(\"region-map\")];\n    if (maps.some(m => m.select && m.select(id))) return;\n    this._anchor = null;\n    this._last = a;\n    const c = (window.SNACK_CITIES || []).find(x => x.id === id);\n    if (c) this.setState({ sel: c, cardOpen: true, pos: this._pos(a) });\n  }\n\n  renderVals() {\n    const blank = { city: \"—\", country: \"\", host: \"—\", email: \"\", initials: \"\", mailto: \"#\" };\n    const s = this.state.sel;\n    const sel = s ? {\n      ...s,\n      initials: s.host.split(\" \").map(w => w[0]).join(\"\").slice(0, 2),\n      mailto: \"mailto:\" + s.email\n    } : blank;\n\n    const pos = this.state.pos || { left: \"24px\", top: \"24px\" };\n    const regionDefs = [\n      { name: \"North America\", lon0: -106, lon1: -74, lat0: 31, lat1: 51 },\n      { name: \"Europe\", lon0: -12, lon1: 30, lat0: 35, lat1: 60 },\n      { name: \"Asia-Pacific\", lon0: 60, lon1: 180, lat0: -50, lat1: 55 }\n    ];\n    const regions = regionDefs.map(r => {\n      const n = this.state.cities.filter(c => c.lon >= r.lon0 && c.lon <= r.lon1 && c.lat >= r.lat0 && c.lat <= r.lat1).length;\n      return { ...r, count: n + (n === 1 ? \" session\" : \" sessions\") };\n    });\n\n    return {\n      regions,\n      sel,\n      cardOpen: !!(s && this.state.cardOpen),\n      cardLeft: pos.left,\n      cardTop: pos.top,\n      closeCard: () => this.setState({ cardOpen: false }),\n      selRows: [\n        { k: \"Date\", v: sel.date || \"—\" },\n        { k: \"Time\", v: sel.time || \"—\" }\n      ],\n      cities: this.state.cities.map(c => ({ ...c, pick: (ev) => this.pick(c.id, ev) })),\n      listCols: (this.props.dateListLayout ?? \"grid\") === \"grid\"\n        ? \"repeat(auto-fill, minmax(220px, 1fr))\" : \"minmax(0,1fr)\"\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
