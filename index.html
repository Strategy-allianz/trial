.fyd,
.fyd-card {
  --a1-blue-dark: #003781;
  --a1-blue-midnight: #122b54;
  --a1-blue-bright: #0e98cc;
  --a1-blue-sky: #6590bd;
  --a1-blue-pale: #c3d7e9;
  --a1-blue-ice: #dbeaf5;
  --a1-blue-fog: #f0f7fc;
  --a1-ink-900: #091223;
  --a1-ink-500: #4b5975;
  --a1-ink-400: #6b7693;
  --a1-ink-75: #e3e5ea;
  --a1-ink-0: #ffffff;
  --font-sans: "Allianz Neo", "Allianz Sans", -apple-system, BlinkMacSystemFont,
    "Segoe UI", Helvetica, Arial, sans-serif;
  --fs-heading-md: 22px;
  --fs-heading-sm: 20px;
  --fs-body-md: 16px;
  --fs-body-sm: 15px;
  --fs-caption: 14px;
  --fw-semibold: 600;
  --r-md: 4px;
  --r-lg: 8px;
  --r-xl: 16px;
  --r-pill: 999px;
  --shadow-1: 0 1px 2px rgba(18, 43, 84, 0.08), 0 1px 1px rgba(18, 43, 84, 0.06);
  --shadow-2: 0 2px 4px rgba(18, 43, 84, 0.12), 0 4px 8px rgba(18, 43, 84, 0.08);
  --shadow-4: 0 12px 24px rgba(18, 43, 84, 0.16), 0 24px 48px rgba(18, 43, 84, 0.12);
  --dur-sm: 160ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);
  font-family: var(--font-sans);
  color: var(--a1-ink-900);
}

.fyd {
  padding: 88px 40px;
  background: var(--a1-blue-fog);
}
.fyd *,
.fyd *::before,
.fyd *::after,
.fyd-card * { box-sizing: border-box; }

.fyd-inner {
  max-width: 1200px;
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  gap: 36px;
}

/* Hero band ---------------------------------------------------------------- */
.fyd-hero {
  background: var(--a1-blue-midnight);
  border-radius: var(--r-xl);
  padding: 44px 48px;
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  justify-content: space-between;
  gap: 32px;
  color: #fff;
}
.fyd-hero__text { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.fyd-hero__title {
  margin: 0;
  font-size: 64px;
  line-height: 0.98;
  font-weight: var(--fw-semibold);
  letter-spacing: -0.025em;
  color: #fff;
}
.fyd-hero__sub { margin: 0; font-size: var(--fs-body-md); color: rgba(255, 255, 255, 0.72); }
.fyd-stats { display: flex; align-items: flex-end; gap: 36px; flex: none; }
.fyd-stat { display: flex; flex-direction: column; gap: 2px; }
.fyd-stat__num {
  font-size: 56px;
  line-height: 1;
  font-weight: var(--fw-semibold);
  letter-spacing: -0.03em;
  color: #fff;
}
.fyd-stat__num--range { letter-spacing: 0.1em; }
.fyd-stat__label {
  font-size: var(--fs-caption);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: rgba(255, 255, 255, 0.6);
}
.fyd-stats__rule { width: 1px; align-self: stretch; background: rgba(255, 255, 255, 0.2); }

/* Region maps -------------------------------------------------------------- */
.fyd-maps {
  position: relative;
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 20px;
}
.fyd-map {
  background: #fff;
  border: 1px solid var(--a1-ink-75);
  border-radius: var(--r-xl);
  box-shadow: var(--shadow-1);
  overflow: hidden;
  display: flex;
  flex-direction: column;
}
.fyd-map__head {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 20px 10px;
}
.fyd-map__name {
  font-size: var(--fs-body-md);
  font-weight: var(--fw-semibold);
  color: var(--a1-blue-dark);
}

/* Dates list --------------------------------------------------------------- */
.fyd-dates { display: flex; flex-direction: column; gap: 14px; }
.fyd-dates__title {
  margin: 0;
  font-size: var(--fs-heading-sm);
  font-weight: var(--fw-semibold);
  color: var(--a1-blue-dark);
}
.fyd-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 12px;
}
.fyd-item {
  all: unset;
  box-sizing: border-box;
  cursor: pointer;
  background: #fff;
  border: 1px solid var(--a1-ink-75);
  border-radius: var(--r-lg);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  font-family: var(--font-sans);
  transition: box-shadow var(--dur-sm) var(--ease-standard),
    border-color var(--dur-sm) var(--ease-standard);
}
.fyd-item:hover { border-color: var(--a1-blue-midnight); box-shadow: var(--shadow-2); }
.fyd-item__badge {
  flex: none;
  min-width: 58px;
  padding: 7px 9px;
  border-radius: var(--r-md);
  background: var(--a1-blue-ice);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 1px;
}
.fyd-item__dow {
  font-size: 11px;
  letter-spacing: 0.09em;
  text-transform: uppercase;
  font-weight: var(--fw-semibold);
  color: var(--a1-blue-sky);
}
.fyd-item__dnum {
  font-size: 24px;
  line-height: 1.05;
  font-weight: var(--fw-semibold);
  color: var(--a1-blue-midnight);
}
.fyd-item__mon {
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--a1-blue-sky);
}
.fyd-item__meta { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.fyd-item__city {
  font-size: var(--fs-body-md);
  font-weight: var(--fw-semibold);
  color: var(--a1-blue-midnight);
}
.fyd-item__country { font-size: var(--fs-caption); color: var(--a1-ink-400); }

/* Detail card -------------------------------------------------------------- */
.fyd-card {
  position: fixed;
  width: 320px;
  max-width: calc(100vw - 24px);
  z-index: 30;
  background: #fff;
  border: 1px solid var(--a1-ink-75);
  border-radius: var(--r-lg);
  box-shadow: var(--shadow-4);
  overflow: hidden;
}
.fyd-card__head {
  padding: 18px 20px;
  background: var(--a1-blue-midnight);
  color: #fff;
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 12px;
}
.fyd-card__titles { display: flex; flex-direction: column; gap: 3px; }
.fyd-card__city {
  font-size: var(--fs-heading-md);
  font-weight: var(--fw-semibold);
  line-height: 1.1;
}
.fyd-card__country { font-size: var(--fs-caption); opacity: 0.75; }
.fyd-card__close {
  all: unset;
  cursor: pointer;
  width: 26px;
  height: 26px;
  border-radius: var(--r-pill);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  line-height: 1;
  color: rgba(255, 255, 255, 0.8);
  flex: none;
}
.fyd-card__close:hover { background: rgba(255, 255, 255, 0.15); color: #fff; }
.fyd-card__rows { padding: 6px 20px 2px; }
.fyd-card__row {
  display: flex;
  justify-content: space-between;
  gap: 16px;
  padding: 11px 0;
  border-bottom: 1px solid var(--a1-ink-75);
}
.fyd-card__k { font-size: var(--fs-caption); color: var(--a1-ink-400); white-space: nowrap; }
.fyd-card__v {
  font-size: var(--fs-body-sm);
  font-weight: var(--fw-semibold);
  text-align: right;
  white-space: pre-line;
  color: var(--a1-ink-900);
}
.fyd-card__host { padding: 14px 20px 18px; display: flex; align-items: center; gap: 12px; }
.fyd-card__avatar {
  width: 36px;
  height: 36px;
  border-radius: var(--r-pill);
  background: var(--a1-blue-ice);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: var(--fs-caption);
  font-weight: var(--fw-semibold);
  color: var(--a1-blue-dark);
  flex: none;
}
.fyd-card__hostmeta { display: flex; flex-direction: column; min-width: 0; }
.fyd-card__hostname { font-size: var(--fs-body-sm); font-weight: var(--fw-semibold); }
.fyd-card__hostmail {
  font-size: var(--fs-caption);
  word-break: break-all;
  color: var(--a1-blue-midnight);
  text-decoration: none;
}
.fyd-card__hostmail:hover { color: var(--a1-blue-bright); text-decoration: underline; }

@media (max-width: 900px) {
  .fyd { padding: 56px 20px; }
  .fyd-hero { padding: 32px 28px; }
  .fyd-hero__title { font-size: 44px; }
  .fyd-maps { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>

<!-- 2. <region-map> custom element -->
<script>
(function () {
  const W = 420, H = 400;

  async function waitLibs() {
    const t0 = Date.now();
    while ((!window.d3 || !window.topojson || !window.SNACK_CITIES) && Date.now() - t0 < 10000) {
      await new Promise(r => setTimeout(r, 50));
    }
    return window.d3 && window.topojson && window.SNACK_CITIES;
  }

  let landPromise = null;
  function getLand() {
    if (!landPromise) {
      landPromise = window.d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json")
        .then(topo => window.topojson.feature(topo, topo.objects.countries));
    }
    return landPromise;
  }

  let statesPromise = null;
  function getStates() {
    if (!statesPromise) {
      statesPromise = window.d3.json("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json")
        .then(topo => window.topojson.mesh(topo, topo.objects.states, (a, b) => a !== b))
        .catch(() => null);
    }
    return statesPromise;
  }

  class RegionMap extends HTMLElement {
    connectedCallback() {
      this.style.display = "block";
      this.hovered = null;
      this._boot();
    }
    async _boot() {
      if (!(await waitLibs())) return;
      const d3 = window.d3;
      const land = await getLand();
      const val = k => {
        const a = this.getAttribute(k);
        if (a != null && a !== "") return +a;
        return typeof this[k] === "number" ? this[k] : NaN;
      };
      const t1 = Date.now();
      while (!["lon0", "lon1", "lat0", "lat1"].every(k => Number.isFinite(val(k))) && Date.now() - t1 < 4000) {
        await new Promise(r => setTimeout(r, 40));
      }
      const lon0 = val("lon0"), lon1 = val("lon1"), lat0 = val("lat0"), lat1 = val("lat1");
      if (![lon0, lon1, lat0, lat1].every(Number.isFinite)) return;
      const midLon = (lon0 + lon1) / 2, midLat = (lat0 + lat1) / 2;
      const box = {
        type: "MultiPoint",
        coordinates: [
          [lon0, lat0], [midLon, lat0], [lon1, lat0],
          [lon0, midLat], [lon1, midLat],
          [lon0, lat1], [midLon, lat1], [lon1, lat1]
        ]
      };
      const projection = d3.geoEquirectangular().fitExtent([[6, 6], [W - 6, H - 6]], box);
      const cities = window.SNACK_CITIES.filter(c =>
        c.lon >= lon0 && c.lon <= lon1 && c.lat >= lat0 && c.lat <= lat1);

      const svg = d3.select(this).append("svg")
        .attr("viewBox", `0 0 ${W} ${H}`)
        .attr("width", "100%")
        .style("display", "block");

      svg.append("rect").attr("width", W).attr("height", H).attr("fill", "var(--a1-ink-0)");
      const wantStates = lon0 > -130 && lon1 < -60 && lat0 > 20 && lat1 < 55;
      svg.append("g").selectAll("path").data(land.features).join("path")
        .attr("d", d3.geoPath(projection))
        .attr("fill", "var(--a1-blue-ice)")
        .attr("stroke", "var(--a1-ink-0)")
        .attr("stroke-width", 0.9);

      if (wantStates) {
        getStates().then(mesh => {
          if (mesh) svg.insert("path", "g + *").datum(mesh)
            .attr("d", d3.geoPath(projection))
            .attr("fill", "none")
            .attr("stroke", "var(--a1-ink-0)")
            .attr("stroke-width", 0.9)
            .attr("stroke-opacity", 0.9);
        });
      }

      cities.forEach(d => {
        const p = projection([d.lon, d.lat]);
        d.ax = p[0]; d.ay = p[1]; d.px = p[0]; d.py = p[1];
      });
      // co-located dots: nudge apart so two sessions in one city read as two pins
      const MIN = 11;
      for (let it = 0; it < 30; it++) {
        let moved = false;
        for (let i = 0; i < cities.length; i++) {
          for (let j = i + 1; j < cities.length; j++) {
            const a = cities[i], b = cities[j];
            let dx = b.ax - a.ax, dy = b.ay - a.ay;
            let dist = Math.hypot(dx, dy);
            if (dist >= MIN) continue;
            if (dist < 0.01) { dx = 1; dy = -0.6; dist = Math.hypot(dx, dy); }
            const push = (MIN - dist) / 2 / dist;
            a.ax -= dx * push; a.ay -= dy * push;
            b.ax += dx * push; b.ay += dy * push;
            moved = true;
          }
        }
        if (!moved) break;
      }

      // Greedy label placement: the dot never moves. Each label takes the first of
      // eight slots around its dot that clears every other dot and placed label;
      // if no slot is clear the label is hidden and revealed on hover/selection.
      const LW = d => d.city.length * 6.5 + 4, LHH = 14;
      const slots = [
        { dx: 0, dy: -12, a: "middle" },
        { dx: -12, dy: -12, a: "middle" },
        { dx: 12, dy: -12, a: "middle" },
        { dx: -6, dy: -12, a: "end" },
        { dx: 6, dy: -12, a: "start" },
        { dx: 0, dy: -18, a: "middle" },
        { dx: -12, dy: -18, a: "middle" },
        { dx: 12, dy: -18, a: "middle" },
        { dx: 0, dy: 17, a: "middle" },
        { dx: -12, dy: 17, a: "middle" },
        { dx: 12, dy: 17, a: "middle" },
        { dx: 0, dy: -24, a: "middle" },
        { dx: -14, dy: -24, a: "middle" },
        { dx: 14, dy: -24, a: "middle" },
        { dx: 10, dy: 4.5, a: "start" },
        { dx: -10, dy: 4.5, a: "end" },
        { dx: 0, dy: 18, a: "middle" },
        { dx: 9, dy: -8, a: "start" },
        { dx: 9, dy: 16, a: "start" },
        { dx: -9, dy: -8, a: "end" },
        { dx: -9, dy: 16, a: "end" }
      ];
      const boxOf = (d, s) => {
        const w = LW(d), x = d.ax + s.dx;
        const x0 = s.a === "start" ? x : s.a === "end" ? x - w : x - w / 2;
        return { x0, x1: x0 + w, y0: d.ay + s.dy - LHH + 3, y1: d.ay + s.dy + 4 };
      };
      const hits = (b, c) => b.x0 < c.x1 + 1 && b.x1 + 1 > c.x0 && b.y0 < c.y1 + 1 && b.y1 + 1 > c.y0;
      const dotBoxes = cities.map(d => ({ d, x0: d.ax - 7, x1: d.ax + 7, y0: d.ay - 7, y1: d.ay + 7 }));
      const clearOfDots = (b, self) => !dotBoxes.some(db => db.d !== self && hits(b, db));
      const placed = [];
      // crowded dots get first pick (they have the fewest free slots)
      const crowd = d => cities.filter(o => o !== d && Math.hypot(o.ax - d.ax, o.ay - d.ay) < 46).length;
      const order = cities.slice().sort((a, b) => crowd(b) - crowd(a) || LW(a) - LW(b));
      // hand-tuned placements for the tightest cluster (the Paris–Munich band is full,
      // so Munich drops below its dot and Stuttgart takes the freed space, left and close)
      const PREF = {
        Stuttgart: { dx: -20, dy: -12, a: "middle" },
        Munich: { dx: 12, dy: -12, a: "middle" },
        Paris: { dx: 0, dy: 17, a: "middle" },
        Bratislava: { dx: 1, dy: -10, a: "start" },
        Budapest: { dx: 10, dy: 4.5, a: "start" },
        Bucharest: { dx: 0, dy: 17, a: "middle" },
        Vienna: { dx: -6, dy: 17, a: "middle" }
      };
      order.slice().sort((a, b) => (PREF[b.city] ? 1 : 0) - (PREF[a.city] ? 1 : 0)).forEach(d => {
        const p = PREF[d.city];
        if (!p) return;
        d.slot = p; d.showLabel = true; d.lead = false; placed.push(boxOf(d, p));
      });
      order.forEach(d => {
        if (PREF[d.city]) return;
        let best = null;
        for (const s of slots) {
          const b = boxOf(d, s);
          if (b.x0 < 3 || b.x1 > W - 3 || b.y0 < 3 || b.y1 > H - 3) continue;
          if (!clearOfDots(b, d)) continue;
          if (placed.some(p => hits(b, p))) continue;
          best = { s, b }; break;
        }
        if (best) {
          d.slot = best.s; d.showLabel = true; d.lead = false; placed.push(best.b);
          return;
        }
        // fallback: step further out (straight above first, then below, then sideways)
        // and draw a short leader line back to the dot
        const far = [];
        [30, 44, 58].forEach(r => {
          far.push({ dx: 0, dy: -r, a: "middle" }, { dx: 0, dy: r * 0.8, a: "middle" },
                   { dx: r * 0.5, dy: -r * 0.7, a: "start" }, { dx: -r * 0.5, dy: -r * 0.7, a: "end" },
                   { dx: r * 0.7, dy: 4.5, a: "start" }, { dx: -r * 0.7, dy: 4.5, a: "end" },
                   { dx: r * 0.5, dy: r * 0.7, a: "start" }, { dx: -r * 0.5, dy: r * 0.7, a: "end" });
        });
        for (const s of far) {
          const b = boxOf(d, s);
          if (b.x0 < 3 || b.x1 > W - 3 || b.y0 < 3 || b.y1 > H - 3) continue;
          if (!clearOfDots(b, d)) continue;
          if (placed.some(p => hits(b, p))) continue;
          d.slot = s; d.showLabel = true; d.lead = true; placed.push(b);
          return;
        }
        // last resort: allow passing near other dots, still never over another label
        for (const s of far) {
          const b = boxOf(d, s);
          if (b.x0 < 3 || b.x1 > W - 3 || b.y0 < 3 || b.y1 > H - 3) continue;
          if (placed.some(p => hits(b, p))) continue;
          d.slot = s; d.showLabel = true; d.lead = true; placed.push(b);
          return;
        }
        d.slot = slots[0]; d.showLabel = false; d.lead = false;
      });

      const g = svg.append("g");
      const self = this;
      const hit = (sel) => sel
        .style("cursor", "pointer")
        .on("pointerdown", function (ev, d) { self._emit(d, self._dotNode(d.id)); })
        .on("mouseenter", (ev, d) => { self.hovered = d.id; self._paint(); })
        .on("mouseleave", () => { self.hovered = null; self._paint(); });

      const dots = hit(g.selectAll("g.pin").data(cities).join("g").attr("class", "pin")
        .attr("transform", d => `translate(${d.ax},${d.ay})`));
      dots.append("circle").attr("r", 13).attr("fill", "transparent");
      dots.append("circle").attr("class", "dot").attr("r", 5.5)
        .attr("pointer-events", "none")
        .attr("fill", "var(--a1-blue-midnight)")
        .attr("stroke", "var(--a1-ink-0)").attr("stroke-width", 2);

      // leader lines for labels that had to sit far from their dot
      const leaders = g.selectAll("line.lead").data(cities.filter(d => d.lead)).join("line")
        .attr("class", "lead")
        .each(function (d) {
          const b = boxOf(d, d.slot);
          const cx = Math.max(b.x0, Math.min(d.ax, b.x1));
          const cy = Math.max(b.y0, Math.min(d.ay, b.y1));
          let dx = cx - d.ax, dy = cy - d.ay;
          const len = Math.hypot(dx, dy) || 1;
          const x1 = d.ax + dx / len * Math.min(7.5, len), y1 = d.ay + dy / len * Math.min(7.5, len);
          window.d3.select(this).attr("x1", x1).attr("y1", y1).attr("x2", cx).attr("y2", cy);
        })
        .attr("stroke", "var(--a1-blue-sky, #6590BD)")
        .attr("stroke-width", 1.1)
        .attr("pointer-events", "none");

      const labels = hit(g.selectAll("g.pinlbl").data(cities).join("g").attr("class", "pinlbl")
        .attr("transform", d => `translate(${d.ax + d.slot.dx},${d.ay + d.slot.dy})`));
      labels.append("text").attr("class", "lbl")
        .attr("text-anchor", d => d.slot.a)
        .attr("font-family", "var(--font-sans)").attr("font-size", 12.5).attr("font-weight", 600)
        .attr("fill", "var(--a1-blue-midnight)")
        .attr("paint-order", "stroke").attr("stroke", "var(--a1-ink-0)").attr("stroke-width", 4)
        .text(d => d.city);

      this._nodes = dots;
      this._labels = labels;
      this._leaders = leaders;
      this._cities = cities;
      this._onDoc = () => this._paint();
      document.addEventListener("city-pick", this._onDoc);
      this._paint();
    }
    disconnectedCallback() {
      if (this._onDoc) document.removeEventListener("city-pick", this._onDoc);
    }
    _paint() {
      if (!this._nodes) return;
      const h = this.hovered, sel = window.__snackSelected;
      const on = d => d.id === h || d.id === sel;
      this._nodes.select(".dot")
        .attr("r", d => on(d) ? 8 : 5.5)
        .attr("fill", d => on(d) ? "var(--a1-blue-dark)" : "var(--a1-blue-midnight)");
      if (this._labels) {
        this._labels.each(function (d) { if (on(d)) this.parentNode.appendChild(this); });
        this._labels
          .style("opacity", d => (d.showLabel || on(d)) ? 1 : 0)
          .style("pointer-events", d => (d.showLabel || on(d)) ? "auto" : "none");
        this._labels.select(".lbl").attr("font-weight", d => on(d) ? 700 : 600);
      }
      if (this._leaders) {
        this._leaders.style("opacity", d => (d.showLabel || on(d)) ? 1 : 0);
      }
    }
    _dotNode(id) {
      let node = null;
      if (this._nodes) this._nodes.each(function (x) { if (x.id === id) node = this; });
      return node;
    }
    select(id) {
      if (!this._cities) return false;
      const d = this._cities.find(c => c.id === id);
      if (!d) return false;
      this._emit(d, this._dotNode(id));
      return true;
    }
    _emit(d, node) {
      window.__snackSelected = d.id;
      const r = node ? node.getBoundingClientRect() : this.getBoundingClientRect();
      this.dispatchEvent(new CustomEvent("city-pick", {
        detail: { ...d, clientX: r.left + r.width / 2, clientY: r.top + r.height / 2 },
        bubbles: true, composed: true
      }));
    }
  }

  if (!customElements.get("region-map")) customElements.define("region-map", RegionMap);
})();
</script>

<!-- 3. Section controller -->
<script>
/* ==========================================================================
   Find your date — section controller (no framework)
   Requires: d3, topojson-client, cities.js, region-map.js
   Mount:    <section class="fyd" data-fyd>…</section>  (see index.html)
   ========================================================================== */
(function () {
  const REGIONS = [
    { name: "North America", lon0: -99, lon1: -87, lat0: 40.5, lat1: 49.5 },
    { name: "Europe", lon0: -12, lon1: 30, lat0: 35, lat1: 60 },
    { name: "Asia-Pacific", lon0: 60, lon1: 180, lat0: -50, lat1: 55 }
  ];
  const CARD_W = 320;

  function el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  // A city running on two days shows one entry per day.
  function splitDays(c) {
    const m = (c.date || "").match(
      /^([A-Za-z]{3,})\s+(\d{1,2})\s*&\s*([A-Za-z]{3,})\s+(\d{1,2})\s+([A-Za-z]{3,})$/
    );
    if (!m) return [c];
    const times = (c.time || "").split("\n");
    const one = (dow, dnum, i) => ({
      ...c,
      date: dow + " " + dnum + " " + m[5],
      time: (times[i] || c.time || "").replace(new RegExp("^" + dow + "\\s+"), "").trim()
    });
    return [one(m[1], m[2], 0), one(m[3], m[4], 1)];
  }

  // "Mon 6 October" -> { dow: "Mon", dnum: "6", mon: "Oct" } for the date badge
  function dayParts(c) {
    const parts = (c.date || "").match(/([A-Za-z]{3,})\s+(\d{1,2})/g) || [];
    const dows = [], days = [];
    parts.forEach((s) => {
      const p = s.split(/\s+/);
      dows.push(p[0].slice(0, 3));
      days.push(p[1]);
    });
    const mon = ((c.date || "").match(/([A-Za-z]{3,})\s*$/) || [, ""])[1].slice(0, 3);
    return { dow: dows.join("\u2013") || "\u2014", dnum: days.join("\u2013") || "\u2014", mon: mon };
  }

  function FindYourDate(root) {
    const cities = window.SNACK_CITIES || [];
    const mapsHost = root.querySelector("[data-fyd-maps]");
    const listHost = root.querySelector("[data-fyd-list]");
    let card = null;
    let anchor = null;
    let cardH = 0;

    // --- region maps -------------------------------------------------------
    if (mapsHost) {
      REGIONS.forEach((r) => {
        const wrap = el("div", "fyd-map");
        const head = el("div", "fyd-map__head");
        head.appendChild(el("span", "fyd-map__name", r.name));
        wrap.appendChild(head);
        const map = document.createElement("region-map");
        map.setAttribute("lon0", r.lon0);
        map.setAttribute("lon1", r.lon1);
        map.setAttribute("lat0", r.lat0);
        map.setAttribute("lat1", r.lat1);
        wrap.appendChild(map);
        mapsHost.appendChild(wrap);
      });
    }

    // --- all dates list (day-first cards) -----------------------------------
    if (listHost) {
      cities.flatMap(splitDays).forEach((c) => {
        const d = dayParts(c);
        const b = el("button", "fyd-item");
        b.type = "button";
        b.dataset.city = c.id;

        const badge = el("span", "fyd-item__badge");
        badge.appendChild(el("span", "fyd-item__dow", d.dow));
        badge.appendChild(el("span", "fyd-item__dnum", d.dnum));
        badge.appendChild(el("span", "fyd-item__mon", d.mon));
        b.appendChild(badge);

        const meta = el("span", "fyd-item__meta");
        meta.appendChild(el("span", "fyd-item__city", c.city));
        meta.appendChild(el("span", "fyd-item__country", c.country));
        b.appendChild(meta);

        b.addEventListener("click", (ev) => pick(c.id, ev));
        listHost.appendChild(b);
      });
    }

    // --- detail card -------------------------------------------------------
    function position(a) {
      if (!card || !a || a.x == null) return;
      const PAD = 12, GAP = 18;
      const h = cardH || card.offsetHeight || 280;
      const vw = window.innerWidth, vh = window.innerHeight;
      let x = a.x + GAP + CARD_W <= vw - PAD ? a.x + GAP : a.x - CARD_W - GAP;
      x = Math.max(PAD, Math.min(x, Math.max(PAD, vw - CARD_W - PAD)));
      const y = Math.max(PAD, Math.min(a.y - 60, Math.max(PAD, vh - h - PAD)));
      card.style.left = x + "px";
      card.style.top = y + "px";
    }

    function close() {
      if (card) { card.remove(); card = null; }
    }

    function render(d) {
      close();
      card = el("div", "fyd-card");
      const initials = (d.host || "").split(" ").map((w) => w[0]).join("").slice(0, 2);

      const head = el("div", "fyd-card__head");
      const titles = el("div", "fyd-card__titles");
      titles.appendChild(el("span", "fyd-card__city", d.city));
      titles.appendChild(el("span", "fyd-card__country", d.country));
      const x = el("button", "fyd-card__close", "\u00d7");
      x.type = "button";
      x.setAttribute("aria-label", "Close");
      x.addEventListener("click", close);
      head.appendChild(titles);
      head.appendChild(x);
      card.appendChild(head);

      const rows = el("div", "fyd-card__rows");
      [["Date", d.date || "\u2014"], ["Time", d.time || "\u2014"]].forEach(([k, v]) => {
        const row = el("div", "fyd-card__row");
        row.appendChild(el("span", "fyd-card__k", k));
        row.appendChild(el("span", "fyd-card__v", v));
        rows.appendChild(row);
      });
      card.appendChild(rows);

      const host = el("div", "fyd-card__host");
      host.appendChild(el("div", "fyd-card__avatar", initials));
      const meta = el("div", "fyd-card__hostmeta");
      meta.appendChild(el("span", "fyd-card__hostname", d.host));
      const mail = el("a", "fyd-card__hostmail", d.email);
      mail.href = "mailto:" + d.email;
      meta.appendChild(mail);
      host.appendChild(meta);
      card.appendChild(host);

      document.body.appendChild(card);
      cardH = card.offsetHeight;
    }

    function show(d, a) {
      render(d);
      anchor = a;
      position(a);
    }

    // Clicking a list row routes through the maps so the matching pin selects too.
    function pick(id, ev) {
      const a = ev && ev.clientX != null
        ? { x: ev.clientX, y: ev.clientY }
        : (() => {
            const b = root.querySelector('[data-city="' + id + '"]');
            if (!b) return null;
            const r = b.getBoundingClientRect();
            return { x: r.right - 8, y: r.top + r.height / 2 };
          })();
      pendingAnchor = a;
      const maps = [...root.querySelectorAll("region-map")];
      if (maps.some((m) => m.select && m.select(id))) return;
      pendingAnchor = null;
      const c = cities.find((x) => x.id === id);
      if (c) show(c, a);
    }

    let pendingAnchor = null;
    document.addEventListener("city-pick", (e) => {
      const a = pendingAnchor || { x: e.detail.clientX, y: e.detail.clientY };
      pendingAnchor = null;
      show(e.detail, a);
    });
    window.addEventListener("resize", () => position(anchor));
    window.addEventListener("scroll", () => position(anchor), { passive: true });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape") close(); });
  }

  function boot() {
    document.querySelectorAll("[data-fyd]").forEach(FindYourDate);
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
  else boot();
})();
</script>
